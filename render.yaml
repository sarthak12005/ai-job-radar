services:
  # Option A: Scheduled Cron Job on Render (Runs every day at 8:30 AM IST)
  - type: cron
    name: daily-job-crawler-cron
    env: python
    region: oregon
    plan: free
    schedule: "0 3 * * *"  # 03:00 UTC = 08:30 AM IST
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python main.py"
    envVars:
      - key: SENDER_EMAIL
        sync: false
      - key: SENDER_PASSWORD
        sync: false
      - key: RECIPIENT_EMAIL
        value: sarthakjoshi12005@gmail.com
      - key: CANDIDATE_NAME
        value: "Sarthak Joshi"
      - key: FIRECRAWL_API_KEY
        sync: false

  # Option B: Web Service with Dashboard & Trigger API
  - type: web
    name: daily-job-crawler-web
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m http.server 8000"
    envVars:
      - key: SENDER_EMAIL
        sync: false
      - key: SENDER_PASSWORD
        sync: false
      - key: RECIPIENT_EMAIL
        value: sarthakjoshi12005@gmail.com

